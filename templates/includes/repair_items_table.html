<div class="table-responsive">
    <table class="data-table" id="repair-items-table">
        <thead>
            <tr>
                <th>النوع</th>
                <th>المنتج</th>
                <th>نوع السعر</th>
                <th>الوصف</th>
                <th style="width: 100px;">الكمية</th>
                <th style="width: 120px;">السعر</th>
                <th style="width: 120px;">الإجمالي</th>
                <th class="no-print">حذف</th>
            </tr>
        </thead>
        <tbody>
            {% if items %}
                {% for item in items %}
                    <tr class="repair-item-row">
                        <td>
                            <input type="hidden" name="item_id[]" value="{{ item.id }}">
                            <select name="item_type[]" class="item-type">
                                <option value="قطع غيار" {% if item.item_type == 'قطع غيار' %}selected{% endif %}>قطع غيار</option>
                                <option value="زيوت" {% if item.item_type == 'زيوت' %}selected{% endif %}>زيوت</option>
                                <option value="خدمة" {% if item.item_type == 'خدمة' %}selected{% endif %}>خدمة</option>
                                <option value="أخرى" {% if item.item_type == 'أخرى' %}selected{% endif %}>أخرى</option>
                            </select>
                        </td>
                        <td>
                            <select name="item_product[]" class="item-product">
                                <option value="">بدون منتج</option>
                                {% for product in products %}
                                    <option value="{{ product.id }}" data-type="{{ product.product_type }}" data-wholesale="{{ product.wholesale_price }}" data-retail="{{ product.retail_price }}" data-description="{{ product.name }}" {% if item.product_id == product.id %}selected{% endif %}>
                                        {{ product.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </td>
                        <td>
                            <select name="item_price_type[]" class="item-price-type">
                                <option value="">عادي</option>
                                <option value="wholesale" {% if item.price_type == 'wholesale' %}selected{% endif %}>جملة</option>
                                <option value="retail" {% if item.price_type == 'retail' %}selected{% endif %}>قطاعي</option>
                            </select>
                        </td>
                        <td><input type="text" name="item_description[]" value="{{ item.description }}" class="item-description"></td>
                        <td><input type="number" min="1" name="item_quantity[]" value="{{ item.quantity }}" class="item-quantity"></td>
                        <td><input type="number" min="0" step="0.01" name="item_price[]" value="{{ item.price }}" class="item-price"></td>
                        <td><input type="text" value="{{ item.total }}" class="item-total" readonly></td>
                        <td class="no-print"><button type="button" class="btn btn-danger btn-icon remove-item-row"><span class="material-icons-round">delete</span></button></td>
                    </tr>
                {% endfor %}
            {% else %}
                <tr class="repair-item-row">
                    <td>
                        <input type="hidden" name="item_id[]" value="">
                        <select name="item_type[]" class="item-type">
                            <option value="قطع غيار">قطع غيار</option>
                            <option value="زيوت">زيوت</option>
                            <option value="خدمة">خدمة</option>
                            <option value="أخرى">أخرى</option>
                        </select>
                    </td>
                    <td>
                        <select name="item_product[]" class="item-product">
                            <option value="">بدون منتج</option>
                            {% for product in products %}
                                <option value="{{ product.id }}" data-type="{{ product.product_type }}" data-wholesale="{{ product.wholesale_price }}" data-retail="{{ product.retail_price }}" data-description="{{ product.name }}">
                                    {{ product.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </td>
                    <td>
                        <select name="item_price_type[]" class="item-price-type">
                            <option value="">عادي</option>
                            <option value="wholesale">جملة</option>
                            <option value="retail">قطاعي</option>
                        </select>
                    </td>
                    <td><input type="text" name="item_description[]" class="item-description"></td>
                    <td><input type="number" min="1" name="item_quantity[]" value="1" class="item-quantity"></td>
                    <td><input type="number" min="0" step="0.01" name="item_price[]" value="0" class="item-price"></td>
                    <td><input type="text" value="0" class="item-total" readonly></td>
                    <td class="no-print"><button type="button" class="btn btn-danger btn-icon remove-item-row"><span class="material-icons-round">delete</span></button></td>
                </tr>
            {% endif %}
        </tbody>
    </table>
</div>

<div class="table-actions no-print mt-3">
    <button type="button" class="btn btn-secondary" id="add-item-row">
        <span class="material-icons-round">add</span>
        <span>إضافة عنصر جديد</span>
    </button>
</div>

<div class="summary-box mt-4">
    <div class="summary-item total">
        <span>إجمالي الفاتورة:</span>
        <span id="grand-total">0.00</span>
        <small>د.ل</small>
    </div>
</div>

<style>
.summary-box {
    display: flex;
    justify-content: flex-end;
    border-top: 2px solid var(--border);
    padding-top: 1.5rem;
}
.summary-item.total {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--primary);
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
}
.summary-item small {
    font-size: 1rem;
    color: var(--text-muted);
}
#repair-items-table input, #repair-items-table select {
    border: 1px solid var(--border);
    padding: 0.5rem;
    border-radius: var(--radius-sm);
    width: 100%;
}
#repair-items-table input[readonly] {
    background: var(--surface-light);
    border: none;
    font-weight: bold;
    color: var(--primary);
}
</style>
