{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | نظام الخوارزمي</title>

<!-- Theme Initialization -->
<script>
    const theme = localStorage.getItem("theme") || "light";
    if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="stylesheet" href="{% static 'css/fixes.css' %}">
<link rel="icon" type="image/png" href="{% static 'img/logo.png' %}">
</head>
<body class="login-body">
<section class="login-panel animate-fadeIn">
<div class="login-card">
<div class="login-logo">
    <img src="{% static 'img/logo.png' %}" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;">
</div>
    <h1>نظام الخوارزمي</h1>
    <p class="login-subtitle">إدارة ورشة السيارات والمحركات باحترافية</p>
    <form method="post" class="stack-form">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
        <div class="field" style="width: 100%;">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary btn-lg" style="margin-top: 1rem; width: 100%;">
            <span>دخول آمن</span>
            <span class="material-icons-round">login</span>
        </button>
    </form>
    
    <div class="login-footer">
        <p>&copy; 2026 نظام الخوارزمي - جميع الحقوق محفوظة</p>
    </div>
</div>
</section>
</body>
</html>
